<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velvet Room — Persona Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+KR:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root {
  --velvet-deep: #060a26;
  --velvet: #14217a;
  --paper: #eef1ff;
  --ink: #060a26;
  --gold: #d4b062;
  --accent: #e8274b;
  --display: "Anton", "Impact", "Arial Narrow", sans-serif;
  --text: "Zen Kaku Gothic New", "Noto Sans KR", "Hiragino Kaku Gothic ProN", "Apple SD Gothic Neo", system-ui, sans-serif;
  --cw: 960px; --ch: 540px; --iw: 560px; --tw: 380px; --nav: 64px; --num: 112px; --tsize: 30px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--velvet-deep); color: var(--paper); font-family: var(--text);
  overflow: hidden; overscroll-behavior: none; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}

/* ── layers ───────────────────────────────────────────── */
#bg, .veil, #stage, #player-layer { position: fixed; inset: 0; width: 100%; height: 100%; }
#bg { z-index: 0; display: block; }
.veil {
  z-index: 1; pointer-events: none;
  background:
    radial-gradient(130% 95% at 50% 42%, rgba(6,10,38,0) 34%, rgba(3,5,18,.84) 100%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,.035) 34px, rgba(0,0,0,.12) 72px, rgba(255,255,255,0) 108px);
}
.veil::after {
  content: ""; position: absolute; inset: 0; opacity: .09; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
#stage { z-index: 2; display: block; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#player-layer { z-index: 3; pointer-events: none; }
#player-shell { position: absolute; opacity: 0; transform-origin: 50% 50%; will-change: transform, opacity; background: #000; pointer-events: none; }
#player-shell.live { pointer-events: auto; }
#player-shell iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }
#glass { position: absolute; inset: 0; cursor: grab; touch-action: none; }

/* ── drawable children of the canvas ─────────────────── */
/* Cards overlap in layout (negative margin) so none of them sits far outside the canvas box. */
.card {
  width: var(--cw); height: var(--ch); margin-bottom: calc(var(--ch) * -1);
  position: relative; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(238,241,255,.18);
}
.card-cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: flex-end; gap: .7em;
  padding: 18% 5% 4.5%;
  background: linear-gradient(to top, rgba(6,10,38,.94) 0%, rgba(6,10,38,.6) 45%, rgba(6,10,38,0) 100%);
  transition: opacity .35s ease;
}
.card-no { font-family: var(--display); font-size: calc(var(--ch) * .2); line-height: .8; color: var(--paper); flex: none; }
.card-title {
  font-weight: 700; font-size: calc(var(--ch) * .052); line-height: 1.4; padding-bottom: .15em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card.is-center .card-cap { opacity: 0; }

.info { width: var(--iw); padding: 10px; pointer-events: none; }
.info-no { display: flex; align-items: flex-end; gap: 10px; }
.info-no .n {
  font-family: var(--display); font-size: var(--num); line-height: .8; letter-spacing: .01em;
  color: transparent; -webkit-text-stroke: 1.5px var(--paper);
}
.info-no .of { font-family: var(--display); font-size: calc(var(--num) * .2); color: var(--gold); padding-bottom: .05em; }
.info-title {
  margin-top: 16px; font-size: var(--tsize); font-weight: 900; line-height: 1.6;
  transform: rotate(-1.5deg); transform-origin: 0 50%;
  animation: banner-sway 2.6s ease-in-out infinite;
}
.info-title span {
  background: var(--paper); color: var(--ink); padding: .1em .42em;
  border: .055em solid var(--ink);
  box-shadow: .14em .16em 0 rgba(6,10,38,.95);
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
/* Persona 5 style banner: the whole skewed box sways smoothly around its rest pose. */
@keyframes banner-sway {
  0%   { transform: rotate(-1.5deg) translateX(0); }
  22%  { transform: rotate(-0.3deg) translateX(7px); }
  48%  { transform: rotate(-2.7deg) translateX(2px); }
  72%  { transform: rotate(-1.1deg) translateX(-3px); }
  100% { transform: rotate(-1.5deg) translateX(0); }
}
@media (prefers-reduced-motion: reduce) {
  .info-title { animation: none; }
}
.info-by { margin-top: 12px; font-size: 14px; font-weight: 500; color: rgba(238,241,255,.66); }

.transport { width: var(--tw); height: 48px; display: flex; align-items: center; gap: 10px; }
.tbtn {
  flex: none; width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
  background: transparent; color: var(--paper); border: 1px solid rgba(238,241,255,.28);
}
.tbtn svg { width: 18px; height: 18px; }
.tbtn:hover { background: var(--paper); color: var(--ink); }
.time {
  flex: none; min-width: 3.4ch; text-align: center; font-family: var(--display); font-size: 15px;
  letter-spacing: .04em; font-variant-numeric: tabular-nums; color: rgba(238,241,255,.85);
}
.seek { flex: 1; min-width: 40px; height: 28px; -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
.seek::-webkit-slider-runnable-track {
  height: 3px;
  background: linear-gradient(to right, var(--accent) 0 var(--p, 0%), rgba(238,241,255,.22) var(--p, 0%) 100%);
}
.seek::-webkit-slider-thumb {
  -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border: 0;
  background: var(--paper); transform: rotate(45deg);
}
.seek:focus-visible { outline: none; }
.seek:focus-visible::-webkit-slider-thumb { background: var(--gold); }

.nav {
  width: var(--nav); height: var(--nav); display: grid; place-items: center; cursor: pointer; border: 0;
  color: var(--paper); background: rgba(238,241,255,.12);
  clip-path: polygon(16% 0, 100% 0, 84% 100%, 0 100%);
}
.nav svg { width: 26px; height: 26px; }
.nav:hover { background: var(--paper); color: var(--ink); }
.tbtn:focus-visible, .nav:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--gold); }

/* ── plain DOM overlays ───────────────────────────────── */
#notice {
  position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(88vw, 520px); text-align: center; font-size: 15px; line-height: 1.75;
  color: rgba(238,241,255,.82); transition: opacity .6s ease;
}
#notice b { display: block; margin-bottom: 10px; font-family: var(--display); font-weight: 400; font-size: 44px; letter-spacing: .02em; color: var(--paper); }
#notice code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; color: var(--gold); }
#notice.hide { opacity: 0; pointer-events: none; }
#toast {
  position: fixed; z-index: 6; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px));
  max-width: min(90vw, 560px); padding: 10px 16px; background: var(--paper); color: var(--ink);
  font-size: 14px; font-weight: 700; transform: translate(-50%, -160%);
  transition: transform .35s cubic-bezier(.2,.9,.2,1);
}
#toast.show { transform: translate(-50%, 0); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#safe-probe {
  position: fixed; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<!-- HTML-in-Canvas stage. Both attribute spellings are set: `content="drawable"` (current explainer)
     and `layoutsubtree` (origin-trial builds). Every drawn child carries `drawable`. -->
<canvas id="stage" layoutsubtree content="drawable">
  <section class="info" drawable>
    <div class="info-no"><span class="n"></span><span class="of"></span></div>
    <h2 class="info-title"><span></span></h2>
    <p class="info-by"></p>
  </section>
  <section class="info" drawable aria-hidden="true">
    <div class="info-no"><span class="n"></span><span class="of"></span></div>
    <h2 class="info-title"><span></span></h2>
    <p class="info-by"></p>
  </section>
  <div class="transport" drawable>
    <button class="tbtn play" type="button" aria-label="일시정지"></button>
    <span class="time cur">0:00</span>
    <input class="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치">
    <span class="time dur">0:00</span>
    <button class="tbtn sound" type="button" aria-label="소리 켜기"></button>
  </div>
  <button class="nav prev" drawable type="button" aria-label="이전 영상">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
  </button>
  <button class="nav next" drawable type="button" aria-label="다음 영상">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"/></svg>
  </button>
  <!-- video cards are appended here -->
</canvas>

<!-- A cross-origin iframe can never be painted into a canvas (read-back-allowed rendering),
     so the live YouTube player is a real DOM layer, posed with the same 3D projection as the canvas cards. -->
<div id="player-layer">
  <div id="player-shell"><div id="yt"></div><div id="glass"></div></div>
</div>

<div id="notice"><b>Velvet Room</b>재생목록 불러오는 중…</div>
<div id="toast" role="status"></div>
<p id="live" class="sr" aria-live="polite"></p>
<div id="safe-probe"></div>

<script src="main.js"></script>
</body>
</html>
